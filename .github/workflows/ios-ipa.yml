# Builds an UNSIGNED Offer Ready .ipa on a free macOS runner. Sign and install it from Windows with Sideloadly.
name: Build iPhone app (unsigned .ipa)
on: workflow_dispatch
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bundle web app and add the iOS project
        working-directory: ios-app
        run: |
          npm install
          node build-www.js
          npx cap add ios
          npx cap sync ios
      - name: Make the app readable in the Files app and portrait/landscape friendly
        working-directory: ios-app/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" Info.plist || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" Info.plist || true
      - name: Build without signing
        working-directory: ios-app/ios/App
        run: |
          ls
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          set -o pipefail
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -n 40 || { grep -E "error:" build.log | head -n 20; exit 1; }
      - name: Package .ipa
        working-directory: ios-app/ios/App
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr OfferReady.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: OfferReady-ipa, path: ios-app/ios/App/OfferReady.ipa }
